[project]
name = "nhl_immaculate"
version = "0.1.0"
description = "immaculate game"
authors = [
    { name = "Charles Poindexter", email = "cpoin87@gmail.com" },
    { name = "Nick Foppe", email = "nrfoppe@gmail.com" },
    { name = "Joshua Erwin", email = "joshua.erwin13@gmail.com" },
]
license = { text = "MIT" }
readme = "README.MD"
requires-python = ">=3.12, <3.14"
dependencies = [
    "blinker==1.9.0",
    "click==8.3.1",
    "colorama==0.4.6",
    "flask==3.1.2",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "werkzeug==3.1.4",
    "flask-pymongo==3.0.1",
    "pymongo==4.16.0",
    "flasgger>=0.5.4,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code"]
